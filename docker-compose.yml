version: '3.8'

services:
  backend:
    build:
      context: ./api/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=America/Sao_Paulo

  frontend:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
